name: Release

# Builds the distributables from public source and publishes them as a GitHub
# Release with SHA-256 checksums. Never commit binaries to the repository:
# binaries inside a source checkout are what gets "Download ZIP" archives
# flagged by browsers and antivirus products.
#
# Windows and Linux build jobs each build the GUI application, the CLI and
# two pyretopo modules (Python 3.11 for Blender 4.2-4.5, 3.13 for 5.x).
# The release job assembles the combined Blender Add-on zip and publishes:
#   InstantMeshes2026_Win64.zip / InstantMeshes2026_Linux64.zip (app + CLI)
#   InstantMeshes2026_AddOn.zip (Blender add-on, all platforms & ABIs)
#   SHA256SUMS.txt
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win64
            runner: windows-latest
          - platform: linux64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install GUI dependencies (Linux)
        if: matrix.platform == 'linux64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxext-dev libxkbcommon-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure (Python 3.11 module for Blender 4.2-4.5)
        shell: bash
        run: cmake -S . -B build311 -DINSTANT_MESHES_BUILD_GUI=OFF
        env:
          Python_ROOT: ${{ env.pythonLocation }}

      - name: Build (Python 3.11)
        run: cmake --build build311 --config Release --parallel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure (GUI app + CLI + Python 3.13 module)
        shell: bash
        # CMAKE_POLICY_VERSION_MINIMUM: the vendored NanoGUI declares an
        # ancient cmake_minimum_required that newer CMake rejects outright.
        run: cmake -S . -B build -DINSTANT_MESHES_BUILD_GUI=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        env:
          Python_ROOT: ${{ env.pythonLocation }}

      - name: Build (GUI + CLI + Python 3.13)
        run: cmake --build build --config Release --parallel

      - name: Run Python integration tests
        shell: bash
        run: |
          python -m pip install numpy
          mod=$(find build -name 'pyretopo*.pyd' -o -name 'pyretopo*.so' | head -n 1)
          if [ -z "$mod" ]; then echo "pyretopo module not found"; exit 1; fi
          PYTHONPATH="$(dirname "$mod")" python test_pyretopo.py

      - name: CLI smoke test
        shell: bash
        run: |
          cli=$(find build -type f \( -name 'InstantMeshes2026CLI' -o -name 'InstantMeshes2026CLI.exe' \) \
                ! -path '*CMakeFiles*' ! -path '*.dir*' | head -n 1)
          if [ -z "$cli" ]; then echo "CLI executable not found"; exit 1; fi
          chmod +x "$cli"
          log=$("$cli" -f 500 -i -o test_output_ci.obj torus.obj 2>&1)
          echo "$log"
          echo "$log" | grep -q "F=" || { echo "CLI produced no output file"; exit 1; }
          echo "$log" | grep -q "\[PASSED\]" || { echo "Quality gates did not pass"; exit 1; }

      - name: Verify GUI executable exists
        shell: bash
        run: |
          gui=$(find build -type f \( -name 'InstantMeshes2026' -o -name 'InstantMeshes2026.exe' \) \
                ! -path '*CMakeFiles*' ! -path '*.dir*' | head -n 1)
          if [ -z "$gui" ]; then echo "GUI executable not found"; exit 1; fi
          chmod +x "$gui"
          echo "GUI binary: $gui ($(stat -c%s "$gui" 2>/dev/null || stat -f%z "$gui") bytes)"

      - name: Package ${{ matrix.platform }} application zip
        shell: bash
        run: python tools/package_release.py --platform ${{ matrix.platform }} --build-dir build --out-dir dist

      - name: Collect binaries for the Add-on zip
        shell: bash
        run: |
          mkdir -p bin
          find build build311 -type f \( -name 'pyretopo*.pyd' -o -name 'pyretopo*.so' \) \
            ! -path '*CMakeFiles*' ! -path '*.dir*' -exec cp {} bin/ \;
          cli=$(find build -type f \( -name 'InstantMeshes2026CLI' -o -name 'InstantMeshes2026CLI.exe' \) \
                ! -path '*CMakeFiles*' ! -path '*.dir*' | head -n 1)
          cp "$cli" bin/

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: bin/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: app-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: bin-*
          merge-multiple: true

      - name: Assemble Blender Add-on zip
        run: python tools/package_release.py --addon --bin-dir bin --out-dir dist

      - name: Generate checksums
        run: python tools/package_release.py --checksums-only dist

      - name: List release files
        run: ls -la dist/ bin/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f | sort)
          if [ ${#files[@]} -eq 0 ]; then echo "No files found in dist/"; exit 1; fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file .github/release_notes.md \
            "${files[@]}"
