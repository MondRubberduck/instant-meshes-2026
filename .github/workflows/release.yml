name: Release

# Builds the distributables from public source and publishes them as a GitHub
# Release with SHA-256 checksums. Never commit binaries to the repository:
# binaries inside a source checkout are what gets "Download ZIP" archives
# flagged by browsers and antivirus products.
#
# Windows and Linux build jobs each produce two pyretopo modules (Python 3.11
# for Blender 4.2-4.5 and Python 3.13 for Blender 5.x); the release job merges
# the per-platform archives and publishes everything with one checksum file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win64
            runner: windows-latest
          - platform: linux64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure (Python 3.11 module for Blender 4.2-4.5)
        shell: bash
        run: cmake -S . -B build311 -DINSTANT_MESHES_BUILD_GUI=OFF
        env:
          Python_ROOT: ${{ env.pythonLocation }}

      - name: Build (Python 3.11)
        run: cmake --build build311 --config Release --parallel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure (Python 3.13 module for Blender 5.x + CLI)
        shell: bash
        run: cmake -S . -B build -DINSTANT_MESHES_BUILD_GUI=OFF
        env:
          Python_ROOT: ${{ env.pythonLocation }}

      - name: Build (Python 3.13)
        run: cmake --build build --config Release --parallel

      - name: Run Python integration tests
        shell: bash
        run: |
          python -m pip install numpy
          mod=$(find build -name 'pyretopo*.pyd' -o -name 'pyretopo*.so' | head -n 1)
          if [ -z "$mod" ]; then echo "pyretopo module not found"; exit 1; fi
          PYTHONPATH="$(dirname "$mod")" python test_pyretopo.py

      - name: CLI smoke test
        shell: bash
        run: |
          cli=$(find build -type f \( -name 'InstantMeshes2026CLI' -o -name 'InstantMeshes2026CLI.exe' \) \
                ! -path '*CMakeFiles*' ! -path '*.dir*' | head -n 1)
          if [ -z "$cli" ]; then echo "CLI executable not found"; exit 1; fi
          chmod +x "$cli"
          log=$("$cli" -f 500 -i -o test_output_ci.obj torus.obj 2>&1)
          echo "$log"
          echo "$log" | grep -q "F=" || { echo "CLI produced no output file"; exit 1; }
          echo "$log" | grep -q "\[PASSED\]" || { echo "Quality gates did not pass"; exit 1; }

      - name: Package ${{ matrix.platform }} archives
        shell: bash
        run: |
          pyd311=$(find build311 -name 'pyretopo*.pyd' -o -name 'pyretopo*.so' | head -n 1)
          if [ -z "$pyd311" ]; then echo "Python 3.11 pyretopo module not found"; exit 1; fi
          python tools/package_release.py --platform ${{ matrix.platform }} \
            --build-dir build --out-dir dist --extra-pyd "$pyd311"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: python tools/package_release.py --checksums-only dist

      - name: List release files
        run: ls -la dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f | sort)
          if [ ${#files[@]} -eq 0 ]; then echo "No files found in dist/"; exit 1; fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file .github/release_notes.md \
            "${files[@]}"
