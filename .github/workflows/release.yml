name: Release

# Builds the distributables from public source and publishes them as a GitHub
# Release with SHA-256 checksums. Never commit binaries to the repository:
# binaries inside a source checkout are what gets "Download ZIP" archives
# flagged by browsers and antivirus products.
#
# Two pyretopo modules are produced: one for Python 3.13 (Blender 5.x) and
# one for Python 3.11 (Blender 4.2-4.5). Both are bundled in the extension
# zip; each Blender picks the ABI-matching one at import time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure (Python 3.11 module for Blender 4.2-4.5)
        shell: pwsh
        run: cmake -S . -B build311 -DINSTANT_MESHES_BUILD_GUI=OFF
        env:
          Python_ROOT: ${{ env.pythonLocation }}

      - name: Build (Python 3.11)
        run: cmake --build build311 --config Release --parallel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure (Python 3.13 module for Blender 5.x + CLI)
        shell: pwsh
        run: cmake -S . -B build -DINSTANT_MESHES_BUILD_GUI=OFF
        env:
          Python_ROOT: ${{ env.pythonLocation }}

      - name: Build (Python 3.13)
        run: cmake --build build --config Release --parallel

      - name: Run Python integration tests
        shell: pwsh
        run: |
          python -m pip install numpy
          $mod = Get-ChildItem -Recurse -Path build -Include "pyretopo*.pyd" | Select-Object -First 1
          if (-not $mod) { throw "pyretopo module not found" }
          $env:PYTHONPATH = $mod.DirectoryName
          python test_pyretopo.py

      - name: Package archives + checksums
        shell: pwsh
        run: |
          $pyd311 = Get-ChildItem -Recurse -Path build311 -Include "pyretopo*.pyd" | Select-Object -First 1
          if (-not $pyd311) { throw "Python 3.11 pyretopo module not found" }
          python tools/package_release.py --build-dir build --out-dir dist --extra-pyd $pyd311.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist -File).FullName
          if (-not $files) { throw "No files found in dist/" }
          gh release create ${{ github.ref_name }} `
            --repo ${{ github.repository }} `
            --title ${{ github.ref_name }} `
            --notes-file .github/release_notes.md `
            $files
